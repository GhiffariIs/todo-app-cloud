# cloudbuild.yaml
steps:
  # Build Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/todo-backend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/todo-backend:latest'
      - './backend'
    id: 'build-backend'

  # Build Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/todo-frontend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/todo-frontend:latest'
      - '--build-arg'
      - 'REACT_APP_API_URL=https://todo-backend-XXXXXXXXX.run.app/api'
      - './frontend'
    id: 'build-frontend'

  # Push Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/todo-backend:$SHORT_SHA'
    id: 'push-backend'

  # Push Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/todo-frontend:$SHORT_SHA'
    id: 'push-frontend'

  # Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'todo-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/todo-backend:$SHORT_SHA'
      - '--region'
      - 'asia-southeast2'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'DB_HOST=${_DB_HOST},DB_PORT=5432,DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},DB_PASSWORD=${_DB_PASSWORD}'
    id: 'deploy-backend'

  # Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'todo-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/todo-frontend:$SHORT_SHA'
      - '--region'
      - 'asia-southeast2'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
    id: 'deploy-frontend'

images:
  - 'gcr.io/$PROJECT_ID/todo-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/todo-backend:latest'
  - 'gcr.io/$PROJECT_ID/todo-frontend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/todo-frontend:latest'

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'