version: '3.8'

services:
  # Backend service - Development mode
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-backend-dev
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_PATH=/app/data
      - NODE_ENV=development
    volumes:
      # Mount source code for hot reload
      - ./backend:/app
      - /app/node_modules
      # Persist database
      - todo-db-data-dev:/app/data
    command: npm run dev
    restart: unless-stopped
    networks:
      - todo-network-dev

  # Frontend service - Development mode
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: todo-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
      - CHOKIDAR_USEPOLLING=true
    volumes:
      # Mount source code for hot reload
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - todo-network-dev

# Define volumes
volumes:
  todo-db-data-dev:
    driver: local

# Define networks
networks:
  todo-network-dev:
    driver: bridge